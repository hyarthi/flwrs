[package]
name = "flwrs-ws-source"
description = "flwrs source plugin: a WebSocket server that turns messages into events, typed by an AsyncAPI document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "flwrs-ws-source"
path = "src/main.rs"

[[bin]]
name = "flwrs-ws-source-config"
path = "src/bin/config.rs"

[dependencies]
flwrs-plugin = { workspace = true, features = ["cli", "tls"] }
flwrs-plugin-kit.workspace = true
flwrs-types.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
clap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
roas-asyncapi.workspace = true
enumset.workspace = true
yaml_serde.workspace = true
pbjson-types.workspace = true
ulid.workspace = true

[dev-dependencies]
flwrs-plugin = { workspace = true, features = ["cli", "tls", "package"] }
flwrs-trellis.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tempfile.workspace = true
