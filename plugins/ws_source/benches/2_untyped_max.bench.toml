# 32 connections send JSON readings back to back (tests/bench.rs), without a document (bytes only). Events/s against a credit window of 64.
name = "untyped, max load"
launch_args = "untyped.json"
credit_window = 64
calibrate = false
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
