# One message per stimulus at 1000/s over a pool of connections; latency from the send to the event (correlated by a field of the message).
name = "typed (AsyncAPI), steady 1000/s"
launch_args = "typed.json"
calibrate = false
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "open"
rate = 1000
