# wss (rustls, ring): 32 connections send JSON readings back to back (tests/bench.rs); compare with 1_typed_max for the encryption overhead.
name = "typed (AsyncAPI), TLS, max load"
launch_args = "typed_tls.json"
credit_window = 64
calibrate = false
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
