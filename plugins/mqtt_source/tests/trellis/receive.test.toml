# Messages published to the broker tests/trellis.rs starts (`${broker}`)
# become events. Each stimulus publishes one QoS 1 message, sensors/<n> with
# the payload m<n>, a content type and a user property.
name = "receives messages as events"
launch_args = "v5.json"

# Messages published before the subscription is in place aren't delivered
# (as in MQTT): give the plugin time to connect and subscribe.
[[steps]]
wait_ms = 1000

[[steps]]
stimulus = true
expect_outputs = [{ path = "topic", eq = "sensors/1" }]

[[steps]]
stimulus = true
expect_outputs = [{ path = "payload", eq = "m2" }]

[[steps]]
stimulus = true
expect_outputs = [{ path = "qos", eq = 1 }]

[[steps]]
stimulus = true
expect_outputs = [{ path = "content_type", eq = "text/plain" }]

[[steps]]
stimulus = true
expect_outputs = [{ path = "user_properties.k[0]", eq = "v" }]
