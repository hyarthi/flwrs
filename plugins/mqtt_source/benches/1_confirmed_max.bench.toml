# A publisher floods the broker (tests/bench.rs); events/s against a credit window of 64. Each message is acked to the broker after the hub's confirmation.
name = "QoS 1 confirmed, max load"
launch_args = "confirmed.json"
credit_window = 64
calibrate = false
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
