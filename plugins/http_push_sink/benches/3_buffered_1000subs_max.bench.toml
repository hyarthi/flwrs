# Acked once in the ring; 1000 SSE subscribers read every event (slow_policy skip: a subscriber that falls behind skips ahead).
name = "buffered, 1000 subscribers, max load"
launch_args = "fanout.json"
payloads = ["payloads/small.json"]
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
in_flight = 64
