[package]
name = "flwrs-http-push-sink"
description = "flwrs sink plugin: an HTTP server broadcasting events to subscribers over Server-Sent Events and long polling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flwrs-plugin = { workspace = true, features = ["cli", "tls"] }
flwrs-plugin-kit.workspace = true
axum.workspace = true
tokio.workspace = true
clap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-util.workspace = true
bytes.workspace = true

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tempfile.workspace = true
hyper = { workspace = true, features = ["client", "http2"] } # benches: HTTP/2 clients
hyper-util.workspace = true
http-body-util.workspace = true
flwrs-plugin = { workspace = true, features = ["cli", "tls", "package"] }
flwrs-trellis.workspace = true
