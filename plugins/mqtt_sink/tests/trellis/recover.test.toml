# No broker at first: a retryable NACK. The stimulus then starts the broker
# (tests/trellis.rs); the sink retries with its backoff (from ~1 s, jitter),
# connects, and publishes again.
name = "recovers when the broker comes up"
launch_args = "recover.json"

[[steps]]
send = "payloads/default.json"
expect_ack = { nack = { retryable = true } }

[[steps]]
stimulus = true

[[steps]]
wait_ms = 3000

[[steps]]
send = "payloads/named.json"
expect_ack = "ack"
