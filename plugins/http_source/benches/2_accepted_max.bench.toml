# 32 keep-alive connections POST typed JSON bodies as fast as they're answered (tests/bench.rs); each answered once its event is sent. Events/s against a credit window of 64.
name = "accepted, max load"
launch_args = "accepted.json"
credit_window = 64
calibrate = false
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
