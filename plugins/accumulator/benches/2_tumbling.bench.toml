# step per event (no output), a window per device closing every second.
name = "1 s tumbling windows, max load"
launch_args = "tumbling.json"
payloads = ["payloads/d1.json", "payloads/d2.json", "payloads/d3.json", "payloads/d4.json"]
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
in_flight = 64
