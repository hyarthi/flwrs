# A steady 1000 events/s: CPU and memory at a realistic load.
name = "1 s tumbling windows, 1000 events/s"
launch_args = "tumbling.json"
payloads = ["payloads/d1.json", "payloads/d2.json", "payloads/d3.json", "payloads/d4.json"]
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "open"
rate = 1000
