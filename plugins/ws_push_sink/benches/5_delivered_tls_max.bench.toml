# TLS (rustls, ring): one WebSocket client takes each event; compare with 1_delivered_max for the encryption overhead.
name = "delivered, 1 subscriber, TLS, max load"
launch_args = "delivered_tls.json"
payloads = ["payloads/small.json"]
warmup_ms = 1000
duration_ms = 5000
repetitions = 3

[load]
model = "closed"
in_flight = 64
