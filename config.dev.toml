# Dev configuration. Run from the repo root:
#   cargo run -p flwrs-app -- --config config.dev.toml
# Everything the server writes at run time goes under ./.data/ (gitignored),
# so it never mixes with the source tree (e.g. installed plugins vs. plugins/ sources).

[http]
host = "127.0.0.1"
port = 8080

[logging]
format = "PLAIN"
level = "DEBUG"

[[logging.sinks]]
sink_type = "CONSOLE"

[db.main]
filename = ".data/main.db"

[plugins]
dir = ".data/plugins"
# Uploads run code on this machine; in dev they're allowed from loopback only
# (no admin_token set, and the server listens on 127.0.0.1).
allow_upload = true

# Where plugins connect. A fixed port so remote/manually started plugins can
# find it (the default, 0, picks a free port; local plugins are told which).
[hub]
host = "127.0.0.1"
port = 7400

# The director runs the enabled scenes; spill-to-disk files go here.
[director]
spool_dir = ".data/scenes"

# Export stats to a local OpenTelemetry collector (e.g. `otelcol` with an
# OTLP/HTTP receiver on 4318). Uncomment to try it.
# [telemetry.otlp]
# endpoint = "http://localhost:4318/v1/metrics"
# interval_ms = 10000

# Write stats to local files (one entry per format: otlp-json, sqlite, influx,
# openmetrics). Uncomment to try it.
# [[telemetry.file]]
# format = "sqlite"
# dir = ".data/telemetry"
# partition = "1h"
