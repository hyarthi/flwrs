[workspace]
resolver = "3"
# Members are listed explicitly (no `plugins/*` glob), so folders under plugins/
# that aren't Rust crates (non-Rust plugins, installed packages) can't break the
# workspace. Add each new Rust plugin here.
members = [
    "core",
    "app",
    "plugin",
    "types",
    "plugins/http_sink",
    "plugins/ticker",
    "plugins/script_transform",
    "plugins/accumulator",
    "plugins/mqtt_sink",
    "plugins/mqtt_source",
    "plugins/ws_sink",
    "trellis",
]

# Shared package metadata; crates opt in with `<field>.workspace = true`.
[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/hyarthi/flwrs"

# Single place for dependency versions. Crates use `<dep>.workspace = true`
# and may add extra `features` on top of the ones listed here.
[workspace.dependencies]
# internal crates
flwrs-core = { path = "core" }
# Without default features: crates opt into the SDK's TLS client (feature `tls`).
flwrs-plugin = { path = "plugin", version = "0.0.7", default-features = false }
# The value tree, dot paths and Lua sandbox (unpublished; server and in-repo plugins).
flwrs-types = { path = "types" }
# The script transform's state store and Lua host (the accumulator builds on them).
flwrs-script-transform = { path = "plugins/script_transform" }
# The developer toolkit, as a dev-dependency of the plugins here (their tests run it).
flwrs-trellis = { path = "trellis" }

# async runtime
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["full"] }
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# logging and errors
log = { version = "0.4.35", features = ["kv", "kv_serde"] }
flexi_logger = "0.31.10"
syslog = "7.0.0"
thiserror = "2.0.21"

# config and CLI
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"

# serialization and validation
serde_json = "1.0.154"
# No remote or file $ref resolution: plugin-supplied schemas must not make the
# server fetch URLs or read local files.
jsonschema = { version = "0.60.2", default-features = false, features = ["idna"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
# Scene imports from tar / tar.gz archives (no xattr support needed).
tar = { version = "0.4.44", default-features = false }
base64 = "0.22.1" # the JSON codec's bytes (flwrs-types)
# Plugins' own state stores (synchronous SQLite). Must use the same
# libsqlite3-sys as sqlx (0.37): only one crate may link the C library.
rusqlite = { version = "0.39.0", features = ["bundled"] }
glob = "0.3.4" # trellis: test/bench file lists and package include/exclude patterns

# time (ticker): jiff reads the system time zone database on Unix and bundles it
# on Windows, so the binary stays small; croner on top of it for cron patterns.
jiff = "0.2.45"
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }

# storage
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "derive"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
sha256 = "1.6.0"
getrandom = "0.4.3"
fs4 = "1.1.0"
flate2 = "1.1.10"
# Lua 5.4 for edge mappings, compiled from vendored C sources (needs a C compiler for the target).
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# Windows: node folders link the plugin's package folders as junctions (no special rights needed).
junction = "2.1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
chrono = "0.4.45"
ulid = "3.0.0"

# HTTP
axum = { version = "0.8.9", features = ["multipart"] }
tower-service = "0.3.3"
tower-layer = "0.3.3"
utoipa = { version = "6.0.0", features = ["yaml", "axum_extras", "chrono", "preserve_order", "debug"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
reqwest = "0.13.5"

# plugin protocol
prost = "0.14.4"
pbjson = "0.9.0"
pbjson-types = "0.9.0"
pbjson-build = "0.9.0"
prost-types = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"
bytes = "1.12.1"

# TLS for remote plugins (ring: cross-compiles without cmake)
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
# MQTT plugins: the client with rustls but no crypto provider of its own (the plugins pass a ring config, so no aws-lc / cmake); the broker only for tests
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rumqttd = { version = "0.20.0", default-features = false }
webpki-roots = "1.0.12"
# WebSocket sink: rustls through our own ring config (no aws-lc), no default connector
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
x509-parser = "0.18.1"

# testing
tempfile = "3.27.0"
# trellis bench: latency histograms and process sampling
hdrhistogram = { version = "7.6.0", default-features = false }
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[workspace.lints.rust]
# Denied everywhere; the single allowed exception is the Windows process
# control in app/src/modules/supervisor/process/windows.rs (see AGENTS.md).
unsafe_code = "deny"
