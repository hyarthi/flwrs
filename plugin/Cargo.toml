[package]
name = "flwrs-plugin"
description = "Plugin protocol and Rust SDK for flwrs, a lightweight server for pluggable workflows"
readme = "README.md"
homepage = "https://github.com/hyarthi/flwrs"
documentation = "https://docs.rs/flwrs-plugin"
keywords = ["flwrs", "workflow", "plugin", "dataflow", "protobuf"]
categories = ["network-programming", "development-tools"]
version = "0.0.2" # published on its own; the other crates follow the workspace version
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
thiserror.workspace = true
prost.workspace = true
prost-types.workspace = true
pbjson.workspace = true
pbjson-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
prost-build.workspace = true
pbjson-build.workspace = true
protoc-bin-vendored.workspace = true
