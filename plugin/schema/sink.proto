syntax = "proto3";

// Messages between a sink plugin and the runtime.
package schema.sink;

import "schema/schema.proto";
import "schema/common.proto";

// --- sink -> runtime ---

// First message on every connection, including after a reconnect.
message Initialize {
  // Instance id: the node id the plugin was started with (--id).
  string plugin_id = 1;
  string plugin_version = 2;
  // Schema of the payloads this sink accepts.
  schema.SchemaDefinition schema = 3;
  // Authenticates this connection: the per-launch token for plugins the hub
  // launched, or the node's pre-shared token for remote plugins. Read from the
  // FLWRS_TOKEN environment variable (or a --token argument).
  string token = 4;
}

message SinkMessage {
  oneof payload {
    Initialize initialize = 1;
    common.Exit exit = 2;
    common.LogEvent log = 3;
    common.ErrorEvent error = 4;
  }
}

// --- runtime -> sink ---

message SinkEvent {
  string plugin_id = 1;
  string plugin_version = 2;
  schema.PluginPayload payload = 3;
  // Hub-managed event metadata; see common.EventMetadata.
  common.EventMetadata metadata = 4;
}

message RuntimeSinkMessage {
  oneof payload {
    common.InitializeResponse initialize = 1;
    common.Shutdown shutdown = 2;
    SinkEvent event = 3;
  }
}
