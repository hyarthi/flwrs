[package]
name = "flwrs-app"
description = "The flwrs server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flwrs-core.workspace = true
flwrs-plugin.workspace = true # payload schema rules, wire framing and messages (shared with the hub)
chrono.workspace = true
log.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rust-embed.workspace = true
axum.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
serde.workspace = true
thiserror.workspace = true
sqlx.workspace = true
async-trait.workspace = true
ulid.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
zip.workspace = true
sha256.workspace = true
getrandom.workspace = true # per-launch plugin tokens
fs4.workspace = true # free disk space for the spill guard (cross-platform, safe API)
mlua = { workspace = true, optional = true } # Lua mappings (feature mapping-lua)
reqwest = { workspace = true, optional = true } # OTLP/HTTP export (feature otel)
pbjson = { workspace = true, optional = true } # OTLP JSON telemetry files (feature otel)
flate2 = { workspace = true, optional = true } # gzip for closed telemetry files (feature telemetry-file)
pbjson-types.workspace = true # Timestamp in event metadata
rustls = { workspace = true, optional = true } # TLS listener for remote plugins (feature remote)
tokio-rustls = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true } # client certificate names (mTLS)
prost.workspace = true # scene export files (.flwr), protocol messages
bytes.workspace = true # opaque event bodies
prost-types.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true # SIGTERM / SIGKILL to plugin process groups (safe API)

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true # Ctrl-Break and Job Objects for plugin processes

[features]
default = ["mapping-lua", "otel", "telemetry-file", "remote"]
# Lua edge mappings (lua rules, script, filter). On by default; build with
# --no-default-features for targets without a working C toolchain or with very
# little flash. Without it, scenes with Lua mappings can be imported but not run.
mapping-lua = ["dep:mlua"]
# Export telemetry to an OpenTelemetry collector (OTLP/HTTP, protobuf). On by
# default; uses the vendored OTLP protos in schema/otlp and reqwest (rustls).
otel = ["dep:reqwest", "dep:pbjson"]
# Write telemetry to local time-partitioned files ([[telemetry.file]]: OTLP
# JSON Lines (with otel), SQLite, InfluxDB line protocol, OpenMetrics). On by
# default; minimal edge builds can leave it out.
telemetry-file = ["dep:flate2"]
# Remote plugins: nodes with `launch = "remote"` (pre-shared tokens, remote_id),
# and the TLS listener ([hub.tls], rustls) with optional client certificates
# (mTLS). On by default; a bare build for a small edge device can leave it
# out, and then only runs local plugins over loopback.
remote = ["dep:rustls", "dep:tokio-rustls", "dep:x509-parser", "flwrs-plugin/tls"]

[build-dependencies]
prost-build.workspace = true
pbjson-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true # parsing config snippets in tests
tower.workspace = true
http-body-util.workspace = true
rcgen.workspace = true # test certificates (TLS / mTLS tests)
