[package]
name = "flwrs-trellis"
description = "Developer toolkit for flwrs plugins: checks that a plugin (in any language) follows the plugin protocol"
readme = "README.md"
homepage = "https://github.com/hyarthi/flwrs"
documentation = "https://docs.rs/flwrs-trellis"
keywords = ["flwrs", "plugin", "conformance", "testing", "protocol"]
categories = ["development-tools::testing", "command-line-utilities"]
version = "0.0.1" # published on its own, like flwrs-plugin
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flwrs-plugin.workspace = true # framing, messages and schema rules
tokio.workspace = true
prost.workspace = true
serde_json.workspace = true
clap.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
